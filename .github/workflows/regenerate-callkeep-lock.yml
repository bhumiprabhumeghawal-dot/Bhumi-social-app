name: Regenerate native call dependency lockfile
on:
  push:
    branches:
      - fix/native-android-incoming-call-current-master
    paths-ignore:
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-android-incoming-call-current-master
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for native Android calls"
          git push
