name: Android APK Build
run-name: Bhumi Social AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'FINAL_APK_BUILD'
      - 'App.js'
      - 'DirectMessagesScreen.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build SocialApp APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm install

      - name: Add reliable Maven Central mirror for Android build
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = path.join(process.cwd(), "node_modules/@react-native/gradle-plugin");
          if (!fs.existsSync(path.join(root, "settings.gradle.kts"))) {
            throw new Error("React Native Gradle plugin settings file was not found");
          }
          const mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }';
          const settingsPath = path.join(root, "settings.gradle.kts");
          let settings = fs.readFileSync(settingsPath, "utf8");
          settings = settings.replace(/repositories\s*\{/, match => match + "\n    " + mirror + "\n    ");
          fs.writeFileSync(settingsPath, settings);
          for (const dir of ["react-native-gradle-plugin", "settings-plugin", "shared", "shared-testutil"]) {
            const file = path.join(root, dir, "build.gradle.kts");
            let source = fs.readFileSync(file, "utf8");
            source = source.replace(/repositories\s*\{/, match => match + "\n  " + mirror + "\n  ");
            fs.writeFileSync(file, source);
          }
          console.log("Added Google-hosted Maven Central mirror to React Native Gradle plugin repositories.");
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
        env:
          CI: "1"

      - name: Build release APK
        timeout-minutes: 55
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 assembleRelease

      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/SocialApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: socialapp-latest
          name: Bhoomi Social Latest APK
          body: Latest Android APK built by GitHub Actions.
          files: android/app/build/outputs/apk/release/*.apk
          overwrite_files: true
          make_latest: true


  publish-ota:
    name: Publish compatible production OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN is missing. OTA was not published."
            exit 1
          fi

      - name: Publish JavaScript update to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel production --message "GitHub master update ${GITHUB_SHA}" --non-interactive
