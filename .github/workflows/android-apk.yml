name: Android APK Build
run-name: Bhumi Social AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/callkeep-native-incoming-ui
    paths:
      - 'FINAL_APK_BUILD'
      - 'App.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build SocialApp APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm install

      - name: Add reliable Maven Central mirror for Android build
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = path.join(process.cwd(), "node_modules/@react-native/gradle-plugin");
          if (!fs.existsSync(path.join(root, "settings.gradle.kts"))) {
            throw new Error("React Native Gradle plugin settings file was not found");
          }
          const mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }';
          const settingsPath = path.join(root, "settings.gradle.kts");
          let settings = fs.readFileSync(settingsPath, "utf8");
          settings = settings.replace(/repositories\s*\{/, match => match + "\n    " + mirror + "\n    ");
          fs.writeFileSync(settingsPath, settings);
          for (const dir of ["react-native-gradle-plugin", "settings-plugin", "shared", "shared-testutil"]) {
            const file = path.join(root, dir, "build.gradle.kts");
            let source = fs.readFileSync(file, "utf8");
            source = source.replace(/repositories\s*\{/, match => match + "\n  " + mirror + "\n  ");
            fs.writeFileSync(file, source);
          }
          console.log("Added Google-hosted Maven Central mirror to React Native Gradle plugin repositories.");
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
        env:
          CI: "1"

      - name: Register Expo app-loader local Maven repository
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const repo = path.join(process.cwd(), "node_modules/unimodules-app-loader/local-maven-repo");
          const pom = path.join(repo, "host/exp/exponent/org.unimodules.apploader/58.0.2/org.unimodules.apploader-58.0.2.pom");
          if (!fs.existsSync(pom)) {
            throw new Error("Expo 58 app-loader Maven POM is missing: " + pom);
          }
          const gradle = path.join(process.cwd(), "android/build.gradle");
          let source = fs.readFileSync(gradle, "utf8");
          const repoLine = '        maven { url = uri("../node_modules/unimodules-app-loader/local-maven-repo") }';
          if (!source.includes(repoLine)) {
            if (source.includes("allprojects {")) {
              source = source.replace(/allprojects\s*\{\s*repositories\s*\{/, match => match + "\n" + repoLine);
            } else {
              source += "\nallprojects { repositories {\n" + repoLine + "\n} }\n";
            }
          }
          fs.writeFileSync(gradle, source);
          console.log("Registered local Expo app-loader Maven repository.");
          NODE

      - name: Trace missing Expo app-loader dependency
        run: |
          echo "Searching generated Android files and installed packages for the invalid Maven coordinate..."
          grep -R -n -B 5 -A 5 "org.unimodules.apploader\\|host.exp.exponent" android node_modules --include="*.gradle" --include="*.gradle.kts" --include="*.pom" --include="*.json" --exclude-dir=".cache" | head -n 240 || true
          echo "Relevant Expo package versions:"
          npm ls expo expo-dev-client expo-updates expo-modules-core --depth=1 || true

      - name: Build release APK
        timeout-minutes: 40
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 assembleRelease

      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/SocialApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: socialapp-latest
          name: Bhoomi Social Latest APK
          body: Latest Android APK built by GitHub Actions.
          files: android/app/build/outputs/apk/release/*.apk
          overwrite_files: true
          make_latest: true

