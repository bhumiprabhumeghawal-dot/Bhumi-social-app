name: LiveKit Native Compatibility Check

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - ".github/workflows/livekit-native-compat-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install existing app dependencies
        run: npm ci
      - name: Test LiveKit package compatibility without changing app manifests
        run: |
          npm install --no-save --package-lock=false \
            @livekit/react-native@3.2.0 \
            @livekit/react-native-expo-plugin@1.2.0 \
            @livekit/react-native-webrtc@150.2.0 \
            livekit-client@2.20.0
      - name: Add LiveKit Expo config plugin for this isolated check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'app.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          const plugins = config.expo.plugins || [];
          if (!plugins.includes('@livekit/react-native-expo-plugin')) {
            plugins.push('@livekit/react-native-expo-plugin');
          }
          config.expo.plugins = plugins;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Generate native projects and validate Expo config
        run: |
          npx expo config --type prebuild
          npx expo prebuild --platform android --non-interactive --no-install
        env:
          CI: "1"
      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
