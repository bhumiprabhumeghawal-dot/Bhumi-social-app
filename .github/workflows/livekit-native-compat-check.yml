name: LiveKit Native Compatibility Check

on:
  push:
    branches: [fix/livekit-webrtc-expo-config]
    paths:
      - "package.json"
      - "app.json"
      - ".github/workflows/livekit-native-compat-check.yml"
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - ".github/workflows/livekit-native-compat-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-native-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve and generate a strict dependency lockfile
        run: npm install --package-lock-only --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify clean reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Validate Expo config and generate Android native project
        run: |
          npx expo config --type prebuild
          npx expo prebuild --platform android --non-interactive --no-install
        env:
          CI: "1"
      - name: Commit the verified lockfile back to this PR branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Regenerate lockfile for verified LiveKit dependencies"
            git push
          fi
