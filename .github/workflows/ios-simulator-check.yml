name: Bhumi Social AI iOS Simulator Check
run-name: iOS Simulator compile check

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Generate and compile iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type prebuild

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --non-interactive --clean
        env:
          CI: "1"

      - name: Compile for iOS Simulator without Apple signing
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Expo prebuild did not generate an Xcode workspace."
            exit 1
          fi
          xcodebuild -list -json -workspace "$WORKSPACE" > "$RUNNER_TEMP/xcode-list.json"
          SCHEME="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["workspace"]["schemes"][0])' "$RUNNER_TEMP/xcode-list.json")"
          echo "Building scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/BhumiSocialDerivedData" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bhumi-Social-iOS-Simulator-Build-Log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
