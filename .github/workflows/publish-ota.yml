name: Publish Bhumi Social OTA Update
run-name: Publish Bhumi Social AI OTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ota:
    name: Publish production OTA
    runs-on: ubuntu-latest
    environment: Planning
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify Expo token is available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is missing. Add it under Settings > Environments > Planning > Environment secrets, or Repository secrets."
            exit 1
          fi
          echo "Expo token is present (value hidden)."

      - name: Publish update to Expo production channel
        run: npx eas-cli@latest update --branch production --platform all --message "Bhumi Social AI production update" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
