name: Publish Bhumi Social OTA Update
run-name: Publish Bhumi Social AI OTA

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Select YES only after explicitly approving a production OTA publish."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

jobs:
  publish-ota:
    name: Publish production OTA
    runs-on: ubuntu-latest
    environment: Planning
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify Expo token is available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is missing. Add it under Settings > Environments > Planning > Environment secrets, or Repository secrets."
            exit 1
          fi
          echo "Expo token is present (value hidden)."

      - name: Verify Expo account, project, production branch and channel access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          export EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is empty after trimming whitespace."
            exit 1
          fi
          echo "Checking Expo account..."
          npx eas-cli@latest whoami
          echo "Checking configured EAS project..."
          npx eas-cli@latest project:info
          echo "Checking production branch access..."
          npx eas-cli@latest branch:list
          echo "Checking production channel mapping..."
          npx eas-cli@latest channel:list

      - name: Publish update to Expo production channel
        if: ${{ inputs.confirm_production == 'YES' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          export EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')"
          npx eas-cli@latest update --branch production --platform all --message "Bhumi Social AI production update ${{ github.sha }}"
