name: iOS App Store / TestFlight Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-production:
    name: Build iPhone distribution app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub repository Actions secrets before running this workflow."
            exit 1
          fi

      - name: Build iOS App Store binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive
