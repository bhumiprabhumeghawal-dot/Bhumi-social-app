# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - name: Parse React Native JavaScript sources
      run: |
        node <<'NODE'
        const fs = require('fs');
        const parser = require('@babel/parser');
        const files = [
          'App.js',
          'api.js',
          'SettingsDashboard.js',
          'CreatorBusinessHub.js',
          'ChatPersonalization.js',
          'VoiceVideoCallControls.js',
          'photoEditor.js',
          'videoEditor.js',
        ];
        for (const file of files) {
          parser.parse(fs.readFileSync(file, 'utf8'), {
            sourceType: 'unambiguous',
            plugins: ['jsx'],
          });
          process.stdout.write('Parsed ' + file + '\\n');
        }
        NODE
    - name: Bundle the Android JavaScript app (no APK build)
      if: matrix.node-version == '22.x'
      run: npx expo export --platform android --output-dir /tmp/bhumi-social-export
    - run: npm run build --if-present
    - run: npm test --if-present