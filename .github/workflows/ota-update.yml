name: Publish In-App OTA Update
on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-update:
    runs-on: ubuntu-latest
    environment: Planning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Verify Expo token is available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is missing. Add it under Settings > Environments > Planning > Environment secrets, or Repository secrets."
            exit 1
          fi
          echo "Expo token is present (value hidden)."
      - name: Publish Android and iOS in-app update
        run: npx eas-cli@latest update --branch production --platform all --message "Bhumi Social AI update ${{ github.sha }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
