name: Publish In-App OTA Update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-update:
    runs-on: ubuntu-latest
    environment: Planning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Verify Expo token is available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is missing. Add it under Settings > Environments > Planning > Environment secrets, or Repository secrets."
            exit 1
          fi
          echo "Expo token is present (value hidden)."
      - name: Verify Expo account and production branch access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          export EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is empty after trimming whitespace."
            exit 1
          fi
          echo "Checking which Expo account owns this token..."
          npx eas-cli@latest whoami
          echo "Checking access to the configured EAS project..."
          npx eas-cli@latest project:info
          echo "Checking production branch permissions..."
          npx eas-cli@latest branch:list

      - name: Publish Android and iOS in-app update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          export EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')"
          npx eas-cli@latest update --branch production --platform all --message "Bhumi Social AI update ${{ github.sha }}" --non-interactive

# Trigger OTA publication for the latest crash-popup cleanup commit.
